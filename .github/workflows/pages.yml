name: Deploy CTRL-TECH to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare static storefront
        run: |
          mkdir -p _site
          rsync -a ./ _site/ --exclude='.git' --exclude='.github' --exclude='app' --exclude='bootstrap' --exclude='config' --exclude='database' --exclude='public' --exclude='resources' --exclude='routes' --exclude='storage' --exclude='tests' --exclude='vendor' --exclude='node_modules' --exclude='*.php' --exclude='artisan' --exclude='composer.json' --exclude='package.json' --exclude='vite.config.js' --exclude='phpunit.xml' --exclude='.env*' --exclude='vercel.json'
          node .github/scripts/prepare-pages.mjs _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
