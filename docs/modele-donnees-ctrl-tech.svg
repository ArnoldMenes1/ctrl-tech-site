<text x="105" y="2730" class="legend">Note : les identités Neon Auth ne sont pas dessinées comme entités métier. auth_user_id et actor_user_id référencent logiquement neon_auth.user.id.</text>
<text x="105" y="2753" class="legend">Les tables sessions et password_reset_tokens sont techniques ; les tables brands et promotions sont conservées dans l'ancien modèle.</text>
