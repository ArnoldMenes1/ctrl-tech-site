customer, delivery</text><text x="98" y="2633" class="field">totals USD/CDF, status, payment</text></g><g><rect x="700" y="2490" width="400" height="176" rx="13" fill="#FFFFFF" stroke="#4B8AC7" stroke-width="2"/><path d="M 713 2490 H 1087 Q 1100 2490 1100 2503 V 2533 H 700 V 2503 Q 700 2490 713 2490" fill="#143D69"/><text x="716" y="2518" class="entity-title">ORDER_ITEMS · storefront</text><text x="718" y="2558" class="field">PK  id : bigint</text><text x="718" y="2583" class="field">FK  order_id : bigint</text><text x="718" y="2608" class="field">product_id, product_slug</text><text x="718" y="2633" class="field">product_name, quantity, unit_price</text></g><g><rect x="1320" y="2490" width="400" height="176" rx="13" fill="#FFFFFF" stroke="#4B8AC7" stroke-width="2"/><path d="M 1333 2490 H 1707 Q 1720 2490 1720 2503 V 2533 H 1320 V 2503 Q 1320 2490 1333 2490" fill="#143D69"/><text x="1336" y="2518" class="entity-title">ADMIN_AUDIT_LOGS · storefront</text><text x="1338" y="2558" class="field">PK  id : bigint</text><text x="1338" y="2583" class="field">actor_user_id : uuid</text><text x="1338" y="2608" class="field">action, entity_type, entity_id</text><text x="1338" y="2633" class="field">details, created_at</text></g>
