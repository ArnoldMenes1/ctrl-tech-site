<text x="105" y="1820" class="section">B — Modèle actuellement utilisé · schéma storefront</text>
<text x="80" y="1880" class="section-note">Les traits pleins représentent les FK déclarées ; les pointillés représentent les correspondances applicatives documentées.</text>
