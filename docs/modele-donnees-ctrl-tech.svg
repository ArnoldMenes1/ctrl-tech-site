<text x="80" y="85" class="title">CTRL-TECH — Modèle conceptuel des données</text>
<text x="80" y="120" class="subtitle">Diagramme entités-associations inspiré de Merise · instantané de la base Neon ctrltech · 12 novembre 2026</text>
<rect x="80" y="155" width="2440" height="45" rx="10" fill="#E7EDF5"/>
<text x="100" y="184" class="legend">PK = clé primaire   ·   FK = clé étrangère   ·   UQ = valeur unique   ·   ? = valeur nullable</text>
<path d="M 1120 178 H 1190" stroke="#6483A8" stroke-width="3"/><text x="1200" y="184" class="legend">Association FK réelle</text>
<path d="M 1510 178 H 1580" stroke="#B7791F" stroke-width="3" stroke-dasharray="9 7"/><text x="1590" y="184" class="legend">Lien logique applicatif (sans FK)</text>
<text x="80" y="265" class="section">A — Ancien modèle e-commerce · schéma public</text>
<text x="80" y="290" class="section-note">Tables historiques encore présentes dans la base. Elles sont séparées du modèle actuellement utilisé par la boutique.</text>
